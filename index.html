
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Minha Loja</title>
</head>

<body>

    <header>
        <h1>JESS <br> Doces e Salgados</h1>
    </header>

    <h2>Nossos Produtos</h2>

    <div class="produtos" id="lista-produtos"></div>

    <div id="carrinho">
        <h2>🛒 Carrinho de Compras</h2>
        <ul id="itens-carrinho"></ul>

        <h3 id="total">Total: R$ 0,00</h3>

        <button onclick="finalizarCompra()">
            Finalizar pelo WhatsApp
        </button>
    </div>

    <script>
        // Produtos da loja
        const produtos = [
            {
                nome: "Camiseta",
                preco: 49.90,
                imagem: "https://placehold.co/300x200?text=Camiseta"
            },
            {
                nome: "Tênis",
                preco: 129.90,
                imagem: "https://placehold.co/300x200?text=Tenis"
            },
            {
                nome: "Relógio",
                preco: 89.90,
                imagem: "https://placehold.co/300x200?text=Relogio"
            }
        ];

        let carrinho = [];

        // Mostrar produtos na tela
        function mostrarProdutos() {
            const lista = document.getElementById("lista-produtos");

            produtos.forEach((produto, index) => {
                lista.innerHTML += `
                    <div class="produto">
                        <img src="${produto.imagem}">
                        <h3>${produto.nome}</h3>
                        <p>R$ ${produto.preco.toFixed(2)}</p>

                        <button onclick="adicionarCarrinho(${index})">
                            Adicionar ao carrinho
                        </button>
                    </div>
                `;
            });
        }

        // Adicionar produto ao carrinho
        function adicionarCarrinho(index) {
            carrinho.push(produtos[index]);
            atualizarCarrinho();
        }

        // Atualizar carrinho
        function atualizarCarrinho() {
            const lista = document.getElementById("itens-carrinho");

            lista.innerHTML = "";

            let total = 0;

            carrinho.forEach((produto, index) => {
                total += produto.preco;

                lista.innerHTML += `
                    <li>
                        ${produto.nome} - R$ ${produto.preco.toFixed(2)}
                        <button onclick="removerItem(${index})">
                            Remover
                        </button>
                    </li>
                `;
            });

            document.getElementById("total").innerText =
                "Total: R$ " + total.toFixed(2);
        }

        // Remover produto
        function removerItem(index) {
            carrinho.splice(index, 1);
            atualizarCarrinho();
        }

        // Finalizar pedido pelo WhatsApp
        function finalizarCompra() {
            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            let mensagem = "Olá! Gostaria de fazer este pedido:\n";

            carrinho.forEach(produto => {
                mensagem += `\n${produto.nome} - R$ ${produto.preco.toFixed(2)}`;
            });

            const total = carrinho.reduce(
                (soma, produto) => soma + produto.preco, 0
            );

            mensagem += `\n\nTotal: R$ ${total.toFixed(2)}`;


            const telefone = "5511974312473";

            const url = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;

            window.open(url, "_blank");
        }

        mostrarProdutos();
    </script>

</body>
